<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Галерея - EcoVolunteer</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            grid-auto-rows: 200px;
            gap: 15px;
        }
        .gallery-item {
            background: var(--glass-bg); border-radius: 15px;
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; border: 1px solid var(--glass-border);
            transition: transform 0.3s;
        }
        .gallery-item:hover { transform: scale(1.05); z-index: 2; box-shadow: var(--glass-shadow); }
        .wide { grid-column: span 2; }
        .tall { grid-row: span 2; }
    </style>
</head>
<body>
    <div id="preloader"><div class="loader"></div></div>
    <header>
        <div class="logo">EcoGlobal</div>
        <nav>
            <a href="index.html" data-lang="navHome">Главная</a>
            <a href="events.html" data-lang="navEvents">Проекты</a>
            <a href="favorites.html" data-lang="navFav">Избранное</a>
            <a href="gallery.html" data-lang="navGallery" class="active">Галерея</a>
            <a href="contact.html" data-lang="navContact">Связь</a>
        </nav>
        <div style="display:flex; gap:10px;">
            <button id="theme-toggle">🌓</button>
            <button id="lang-toggle">RU</button>
        </div>
    </header>

    <div class="container">
        <h2 data-lang="navGallery" style="text-align: center; margin-bottom: 2rem;" class="hidden-scroll">Галерея</h2>
        <div class="gallery hidden-scroll">
            <div class="gallery-item wide">🌲 Фото 1</div>
            <div class="gallery-item tall">💧 Фото 2</div>
            <div class="gallery-item">🐾 Фото 3</div>
            <div class="gallery-item">🌍 Фото 4</div>
            <div class="gallery-item wide">🤝 Фото 5</div>
        </div>
    </div>
    
    <button id="btn-up">↑</button>
    <footer><p>&copy; 2026 EcoGlobal.</p></footer>
    <script src="script.js"></script>
</body>
</html>
